[project]
name = "rss-aggregator-commentator"
version = "0.1.0"
description = "AI comment generation job (Cloud Run Job) for rss-aggregator"
requires-python = ">=3.12"
dependencies = [
    "rss-aggregator-shared",
    "google-genai>=2.19.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
cloud = [
    "rss-aggregator-shared[cloud]",
    "google-genai>=2.19.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["comment*"]

[tool.uv.sources]
rss-aggregator-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

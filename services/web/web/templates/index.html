<!doctype html>
<html lang="ja">
  <head>
    {% include "_google_analytics.html" %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }} — 新着一覧</title>
    <meta name="description" content="{{ meta_description }}">
    <link rel="icon" href="/favicon.ico" sizes="32x32" type="image/png">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="canonical" href="{{ canonical_url }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:title" content="{{ app_name }}">
    <meta property="og:description" content="{{ meta_description }}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ app_name }}">
    <meta name="twitter:description" content="{{ meta_description }}">
    <link rel="alternate" type="application/rss+xml" title="{{ app_name }}" href="{{ rss_absolute_url }}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {# ルート配信前提。サブパス配信なら request 付き url_for('static', path='styles.css') を。CSS 未適用の主因は mimetypes 側で対処。 #}
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body class="hn-root">
    <header class="hn-header">
      <div class="hn-header-inner">
        <h1 class="hn-brand">
          <a href="/">{{ app_name }}</a>
        </h1>
        {% include "_header_nav.html" %}
      </div>
    </header>

    <main class="hn-main">
      <div class="hn-list-wrap">
        {% include "_articles.html" %}
      </div>
    </main>

    <footer class="hn-footer" role="contentinfo">
      <div class="hn-footer-inner hn-footer-links">
        {% include "_footer_nav.html" %}
      </div>
    </footer>
  </body>
</html>

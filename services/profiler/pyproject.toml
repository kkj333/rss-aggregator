[project]
name = "rss-aggregator-profiler"
version = "0.1.0"
description = "Blog profile generation job (Cloud Run Job) for rss-aggregator"
requires-python = ">=3.12"
dependencies = [
    "rss-aggregator-shared",
    "google-adk>=2.6.3",
]

[project.optional-dependencies]
cloud = [
    "rss-aggregator-shared[cloud]",
    "google-adk>=2.6.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["feed_profiler*"]

[tool.uv.sources]
rss-aggregator-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
